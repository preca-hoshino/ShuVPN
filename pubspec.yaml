name: shuvpn
description: "SHU RVPN (Sangfor EasyConnect / aTrust) client for Android, signed in through the university's unified identity provider."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Sangfor aTrust / Easy Connect support, in pure Dart.
  #
  # `flutter_sangfor` owns the session lifecycle and the userspace SOCKS5
  # frontend; the two connector packages carry the protocol cores and never
  # depend on each other. Everything is published on pub.dev -- except the
  # first one, which is vendored under `third_party/` and pointed at by
  # `dependency_overrides` below, because its Android VpnService needs four
  # local patches (see the class doc in
  # `third_party/flutter_sangfor/android/src/main/kotlin/com/tsinbei/flutter_sangfor/VpnTunnelService.kt`).
  # It also carries the desktop TUN adapters (`TunDevice` for Linux,
  # `UtunDevice` for macOS, `WintunDevice` for Windows) that the system-VPN
  # data plane is built on.
  flutter_sangfor: ^0.0.5
  flutter_sangfor_easy_connect: ^0.0.5
  flutter_sangfor_atrust: ^0.0.5

  # The userspace SOCKS5 frontend. Pure Dart, so it runs on every platform
  # the app does -- that is what makes the proxy the fallback data plane
  # where a system-VPN interface is unavailable (desktop without
  # privileges) or not capture-everything by design (Android).
  socks5_proxy: ^2.1.1

  # SHA-256 of the server certificate, for the trust-on-first-use store.
  crypto: ^3.0.3

  # RSA PKCS#1 v1.5, required by the SHU unified-identity password exchange
  # (`POST newsso.shu.edu.cn/oauth/userLogin`) and by the aTrust tunnel core.
  pointycastle: ^4.0.0
  http: ^1.6.0

  # Persists the pinned certificate fingerprint per server.
  shared_preferences: ^2.3.3
  provider: ^6.1.5+1
  go_router: ^18.0.1

  # The unified-identity callback is completed in a hidden WebView: the SSO
  # session lives in the WebView cookie store, not in dart:io, so the last leg
  # of every per-system login has to run in a real browser engine.
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  # Launches the enterprise-WeChat app for the QR confirmation page.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# `flutter_sangfor_atrust` / `flutter_sangfor_easy_connect` declare
# `flutter_sangfor` as a hosted dependency; an override is the only way to
# make every dependent resolve to the patched copy instead. Drop this block
# once the patches land upstream.
dependency_overrides:
  flutter_sangfor:
    path: third_party/flutter_sangfor

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The account panel's mark. Two variants because the light-blue artwork
  # disappears on a dark surface; the widget picks by brightness.
  assets:
    - assets/images/


  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
