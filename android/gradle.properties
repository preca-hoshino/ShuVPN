android.useAndroidX=true

# Kotlin incremental compilation is disabled for this build.
#
# The `:flutter_sangfor` plugin project keeps its sources in the pub cache on
# C: while Gradle's root dir is on D:. Kotlin's relocatable incremental cache
# requires every input to share a root with the cache directory, so the cache
# cannot be written and the task dies while closing it:
#
#   java.lang.IllegalArgumentException: this and base files have different roots:
#     C:\Users\...\Pub\Cache\hosted\...\flutter_sangfor-0.0.5\android\src\main\kotlin\...kt
#     and D:\Code Library\Flutter\ShuVPN\android.
#     Suppressed: java.lang.IllegalStateException: Storage for
#       [.../kotlin/compileDebugKotlin/cacheable/caches-jvm/jvm/kotlin/class-fq-name-to-source.tab]
#       is already registered
#
# IMPORTANT: `~/.gradle/gradle.properties` wins over this file — Gradle
# resolves properties as command line > GRADLE_USER_HOME > project directory.
# This key only takes effect because `kotlin.incremental` was removed from that
# global file. Re-adding it globally silently re-enables the broken cache, and
# `org.gradle.*` keys overridden here (caching/parallel) would be ignored too.
kotlin.incremental=false

# Both of these were added automatically by the Flutter migrator.
android.builtInKotlin=false
android.newDsl=false
